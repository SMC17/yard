name: Yard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    name: Core composition chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test core modules + composition
        run: zig build test-core --summary all
      - name: Run canonical example
        run: zig build run-example
      - name: Run full vessel assessment
        run: zig build run-full-assessment

  test-all:
    name: All primitive modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test all primitive modules
        run: zig build test-all --summary all

  test-frontier:
    name: Fleet, Arena, telemetry, and viewer proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof-gate tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run frontier integration gate
        run: zig build test-frontier --summary all
      - name: Check Arena browser sources
        run: |
          node --check arena/web/app.js
          node --check arena/web/tests/smoke.mjs

  test-native-vulkan:
    name: Native Vulkan frame parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install Vulkan loader and software device
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Test native Vulkan queue and readback
        working-directory: viz-vulkan
        run: zig build test -Dvulkan=true --summary all
      - name: Mesh-derived box-barge CPU PPM smoke
        working-directory: viz-vulkan
        run: |
          zig build render-frame -- scenes/box-barge-mesh-canonical.json -o /tmp/box-barge-mesh-ref.ppm
          zig build render-frame -- scenes/box-barge-envelope-mesh.json -o /tmp/box-barge-envelope-ref.ppm
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              "/tmp/box-barge-mesh-ref.ppm",
              "/tmp/box-barge-envelope-ref.ppm",
          ):
              p = Path(path)
              data = p.read_bytes()
              assert data.startswith(b"P6"), data[:16]
              assert p.stat().st_size > 64, p.stat().st_size
              print(f"cpu ppm ok path={path} bytes={p.stat().st_size}")
          PY
      - name: Mesh-derived box-barge native Vulkan PPM smoke
        working-directory: viz-vulkan
        run: |
          zig build native-frame -Dvulkan=true -- \
            scenes/box-barge-mesh-canonical.json \
            -o /tmp/box-barge-mesh-native.ppm --width 960 --height 540
          zig build native-frame -Dvulkan=true -- \
            scenes/box-barge-envelope-mesh.json \
            -o /tmp/box-barge-envelope-native.ppm --width 960 --height 540
          python3 - <<'PY'
          from pathlib import Path
          for path in (
              "/tmp/box-barge-mesh-native.ppm",
              "/tmp/box-barge-envelope-native.ppm",
          ):
              p = Path(path)
              data = p.read_bytes()
              assert data.startswith(b"P6"), data[:16]
              # 960*540*3 + header
              assert p.stat().st_size > 960 * 540, p.stat().st_size
              print(f"native ppm ok path={path} bytes={p.stat().st_size}")
          PY

  test-hosted-arena:
    name: Hosted Arena control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: arena/hosted/package-lock.json
      - name: Install pinned Worker dependencies
        working-directory: arena/hosted
        run: npm ci
      - name: Test contracts, coordination, crypto, and config drift
        working-directory: arena/hosted
        run: npm run check
      - name: Apply a fresh local D1 schema
        working-directory: arena/hosted
        run: npm run db:local
      - name: Dry-run Worker and pinned Sandbox image build
        working-directory: arena/hosted
        run: npm run build

  oracle-and-dataset:
    name: Oracle + dataset integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Oracle self-test
        run: python tools/oracle/yard_stability_oracle.py
      - name: Generate seed dataset
        run: python tools/dataset/generate.py --samples 20 --output /tmp/seed.jsonl
      - name: Verify dataset integrity
        run: python tools/eval/harness.py --dataset /tmp/seed.jsonl --mode oracle
      - name: Gap audit baseline
        run: |
          python tools/dataset/generate.py --samples 30 --output /tmp/eval.jsonl --split eval --seed 9999
          python tools/gap_audit/gap_audit.py --dataset /tmp/eval.jsonl --baseline naive_no_fs --limit 30
      - name: Multimodal render smoke
        run: |
          python tools/dataset/render_multimodal.py --input /tmp/eval.jsonl \
            --output /tmp/mm.jsonl --images-dir /tmp/images --max 5
      - name: yard-cli smoke
        run: |
          python tools/cli/yard-cli.py stability --L 10 --B 4 --T 1.5 --kg 1.0 --json | python -c "import sys,json; d=json.load(sys.stdin); assert d['answer']['overall']=='PASS'"
